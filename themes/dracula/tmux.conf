# Dracula Theme for Tmux

# 颜色定义
dracula_background='#282a36'
dracula_current_line='#44475a'
dracula_foreground='#f8f8f2'
dracula_comment='#6272a4'
dracula_cyan='#8be9fd'
dracula_green='#50fa7b'
dracula_orange='#ffb86c'
dracula_pink='#ff79c6'
dracula_purple='#bd93f9'
dracula_red='#ff5555'
dracula_yellow='#f1fa8c'

# 状态栏样式
set -g status-style "bg=$dracula_current_line,fg=$dracula_foreground"
set -g status-left-style "bg=$dracula_purple,fg=$dracula_background"
set -g status-right-style "bg=$dracula_purple,fg=$dracula_background"

# 窗口状态栏
set -g window-status-style "bg=$dracula_current_line,fg=$dracula_foreground"
set -g window-status-current-style "bg=$dracula_purple,fg=$dracula_background"
set -g window-status-activity-style "bg=$dracula_orange,fg=$dracula_background"
set -g window-status-bell-style "bg=$dracula_red,fg=$dracula_background"

# 面板边框
set -g pane-border-style "fg=$dracula_comment"
set -g pane-active-border-style "fg=$dracula_purple"

# 消息样式
set -g message-style "bg=$dracula_current_line,fg=$dracula_cyan"
set -g message-command-style "bg=$dracula_current_line,fg=$dracula_cyan"

# 状态栏内容
set -g status-left " #S "
set -g status-right " %Y-%m-%d %H:%M "
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "