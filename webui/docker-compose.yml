version: '3.8'

services:
  webui:
    build: .
    container_name: dotfiles-webui
    ports:
      - "5000:5000"
    volumes:
      # 挂载 dotfiles 目录（只读）
      - ..:/dotfiles:ro
      # 挂载配置目录（读写）
      - ~/.dotfiles:/root/.dotfiles
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    networks:
      - dotfiles-net

networks:
  dotfiles-net:
    driver: bridge
