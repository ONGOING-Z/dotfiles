# don't rename windows automatically
set-option -g allow-rename off

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

set -g base-index         1     # 窗口编号从 1 开始计数
set -g renumber-windows   on    # 关掉某个窗口后，编号重排
# Enable 256-color
# If don't set this, the color in tmux probably will be different in out envir.
set -g default-terminal "tmux-256color"
set-option -as terminal-overrides ",xterm-256color:RGB"
# Ensure tmux starts a login zsh (handles macOS Homebrew zsh path too)
set -g default-shell /bin/zsh
if-shell 'test -x /opt/homebrew/bin/zsh' 'set -g default-shell /opt/homebrew/bin/zsh'
if-shell 'test -x /usr/local/bin/zsh' 'set -g default-shell /usr/local/bin/zsh'
set -g default-command "/bin/zsh -l"
if-shell 'test -x /opt/homebrew/bin/zsh' 'set -g default-command "/opt/homebrew/bin/zsh -l"'
if-shell 'test -x /usr/local/bin/zsh' 'set -g default-command "/usr/local/bin/zsh -l"'

# THEME2
set -g status-bg black
set -g status-fg white
set -g status-style bright

# default window title colors
set-window-option -g window-status-style fg=white
set-window-option -g window-status-style bg=default
set-window-option -g window-status-style dim

# active window title colors
set-window-option -g window-status-current-style fg=white
set-window-option -g window-status-current-style bg=default
set-window-option -g window-status-current-style bright



# Highlight active window
set-window-option -g window-status-current-style bg=red

set -g status-interval 60
set -g status-left-length 30
set -g status-left '#{prefix_highlight} | #[fg=green](#S) | #(whoami)'
#set -g status-right '#[fg=yellow]#(cut -d " " -f 1-3 /proc/loadavg)#[default] #[fg=white]%H:%M#[default]'
set -g status-right ''
#set -g status-right '#{prefix_highlight} #H | %a %Y-%m-%d %H:%M'

# Enable integrated clipboard where supported (tmux >= 3.2)
set -g set-clipboard on

# In tmux use vim mode
set-window-option -g mode-keys vi
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Clipboard: default to xsel (Linux), prefer xclip if available, override to pbcopy on macOS
bind -T copy-mode-vi y send-keys -X copy-pipe "xsel -ib"
if-shell 'command -v xclip >/dev/null 2>&1' 'bind -T copy-mode-vi y send-keys -X copy-pipe "xclip -in -selection clipboard"'
if-shell 'uname | grep -qi darwin' 'bind -T copy-mode-vi y send-keys -X copy-pipe "pbcopy"'

# ============================================================================
# 鼠标支持配置
# ============================================================================

# 启用鼠标支持
set -g mouse on

# 鼠标选择文本时的行为
# 注意：tmux 2.1+ 只需要 set -g mouse on
# 以下选项是为了兼容旧版本 tmux（< 2.1）
if-shell "tmux -V | awk '{exit ($2 < 2.1)}'" \
  "set -g mouse on" \
  "set -g mode-mouse on; set -g mouse-resize-pane on; set -g mouse-select-pane on; set -g mouse-select-window on"

# 鼠标滚轮支持
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M

# 复制模式的鼠标支持
# 使用鼠标拖动选择文本（按住 Shift 可以使用终端的原生选择）
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel

# macOS 特定配置：使用 pbcopy
if-shell "uname | grep -q Darwin" \
  "bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'pbcopy'"

# Linux 特定配置：使用 xclip 或 xsel
if-shell "uname | grep -q Linux" \
  "bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'"

# 双击选择单词
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word

# 三击选择整行
bind -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line

# 右键粘贴
bind -n MouseDown3Pane paste-buffer

# 中键粘贴（Linux）
bind -n MouseDown2Pane paste-buffer

# ============================================================================
# 鼠标模式切换快捷键
# ============================================================================

# Prefix + m 启用鼠标
bind m \
  set -g mouse on \;\
  display 'Mouse: ON'

# Prefix + M 禁用鼠标  
bind M \
  set -g mouse off \;\
  display 'Mouse: OFF'

# 快速切换鼠标模式（Prefix + Ctrl-m）
bind C-m if -F '#{s/off//:status}' \
  'set -g mouse off; display "Mouse: OFF"' \
  'set -g mouse on; display "Mouse: ON"'

# List of plugins
# install cmd: prefix(C-a) + I
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-yank'  # 增强复制功能，更好的鼠标支持

# tmux-prefix-highlight
set -g @prefix_highlight_fg 'white' # default is 'colour231'
set -g @prefix_highlight_bg 'blue'  # default is 'colour04'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
