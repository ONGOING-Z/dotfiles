# Navi 配置文件
# 交互式命令行备忘单配置

# 搜索配置
search:
  # 使用的搜索工具 (fzf, skim)
  finder: fzf
  
  # 搜索预览
  preview: true
  
  # 预览窗口大小
  preview_window: "right:50%"

# 界面配置
ui:
  # 颜色主题 (dark, light)
  color_scheme: dark
  
  # 显示标签
  show_tags: true
  
  # 显示注释
  show_comments: true

# 快捷键配置
keybindings:
  # 打开 Navi (默认: Ctrl+G)
  open: "ctrl-g"
  
  # 执行命令 (默认: Enter)
  execute: "enter"
  
  # 复制到剪贴板 (默认: Ctrl+Y)
  copy: "ctrl-y"
  
  # 退出 (默认: Esc)
  quit: "esc"

# 路径配置
paths:
  # 备忘单目录
  cheats_path: "~/.local/share/navi/cheats"
  
  # 配置目录
  config_path: "~/.config/navi"

# Shell 集成
shell:
  # 自动补全
  auto_complete: true
  
  # 历史集成
  history_integration: true

# 高级选项
advanced:
  # 缓存搜索结果
  cache_search: true
  
  # 日志级别 (error, warn, info, debug)
  log_level: "info"
  
  # 并发搜索
  concurrent_search: true