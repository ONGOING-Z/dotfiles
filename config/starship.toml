# Starship 配置文件
# 现代化的跨 shell 提示符配置

# 获取编辑器完成
"$schema" = 'https://starship.rs/config-schema.json'

# 在提示符之间插入空行
add_newline = true

# 替换提示符中的 "❯" 符号为 "➜"
[character]
success_symbol = "[➜](bold green)"
error_symbol = "[➜](bold red)"

# 禁用包管理器模块
[package]
disabled = true

# 自定义格式
format = """
[╭─](bold blue)$all[╰─](bold blue)$character"""

# 右侧提示符格式
right_format = """$time"""

# 目录配置
[directory]
style = "bold cyan"
truncation_length = 3
truncation_symbol = "…/"
home_symbol = "~"

# 显示完整路径的别名
[directory.substitutions]
"Documents" = "📄"
"Downloads" = "📥"
"Music" = "🎵"
"Pictures" = "📷"
"Videos" = "📹"

# Git 配置
[git_branch]
symbol = "🌱 "
truncation_length = 10
truncation_symbol = ""
style = "bold purple"

[git_status]
style = "bold yellow"
ahead = "⇡${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
behind = "⇣${count}"
deleted = "🗑"
renamed = "📛"
modified = "📝"
staged = "✚"
untracked = "🤷"

[git_commit]
commit_hash_length = 7
tag_symbol = "🔖 "
style = "bold green"

# 编程语言配置
[nodejs]
symbol = "⬢ "
style = "bold green"

[python]
symbol = "🐍 "
style = "bold blue"
pyenv_version_name = true

[rust]
symbol = "🦀 "
style = "bold red"

[java]
symbol = "☕ "
style = "bold red"

[golang]
symbol = "🐹 "
style = "bold cyan"

[docker_context]
symbol = "🐳 "
style = "bold blue"

[kubernetes]
symbol = "⎈ "
style = "bold purple"
disabled = false

# AWS 配置
[aws]
symbol = "☁️  "
style = "bold orange"

# 命令执行时间
[cmd_duration]
min_time = 2_000
show_milliseconds = false
format = "took [$duration](bold yellow)"

# 时间显示
[time]
disabled = false
format = '🕙[\[ $time \]](bold white)'
time_format = "%T"

# 用户名配置
[username]
style_user = "bold dimmed blue"
show_always = false

# 主机名配置
[hostname]
ssh_only = true
format = '[$hostname](bold red) '
trim_at = "."
disabled = false

# 电池状态
[battery]
full_symbol = "🔋 "
charging_symbol = "⚡️ "
discharging_symbol = "💀 "

[[battery.display]]
threshold = 10
style = "bold red"

[[battery.display]]
threshold = 30
style = "bold yellow"

# 内存使用情况
[memory_usage]
disabled = false
threshold = 70
symbol = "🐏"
style = "bold dimmed green"

# Shell 配置
[shell]
fish_indicator = "󰈺"
powershell_indicator = "_"
unknown_indicator = "mystery shell"
style = "cyan bold"
disabled = false

# 状态码配置
[status]
style = "bg:blue"
symbol = "🔴"
format = '[\[$symbol $common_meaning$signal_name$maybe_int\]]($style) '
map_symbol = true
disabled = false

# 容器配置
[container]
format = '[$symbol \[$name\]]($style) '

# 作业数配置
[jobs]
symbol = "+ "
number_threshold = 1
symbol_threshold = 1

# 环境变量显示
[env_var.SHELL]
variable = "SHELL"
default = "unknown shell"

# 自定义命令
[custom.git_server]
command = "echo git"
when = 'git rev-parse --is-inside-work-tree 2> /dev/null'
style = "bold green"
format = "on [$output]($style) "

# Nerd Font 符号配置（如果使用 Nerd Font）
[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)
vicmd_symbol = "[❮](bold yellow)"

# 自定义模块顺序
format = """
$username\
$hostname\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_metrics\
$git_status\
$hg_branch\
$docker_context\
$package\
$cmake\
$cobol\
$dart\
$deno\
$dotnet\
$elixir\
$elm\
$erlang\
$golang\
$helm\
$java\
$julia\
$kotlin\
$lua\
$nim\
$nodejs\
$ocaml\
$perl\
$php\
$pulumi\
$purescript\
$python\
$rlang\
$red\
$ruby\
$rust\
$scala\
$swift\
$terraform\
$vlang\
$vagrant\
$zig\
$nix_shell\
$conda\
$spack\
$memory_usage\
$aws\
$gcloud\
$openstack\
$azure\
$env_var\
$crystal\
$custom\
$sudo\
$cmd_duration\
$line_break\
$jobs\
$battery\
$time\
$status\
$shell\
$character"""