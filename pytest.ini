[pytest]
# pytest 配置文件

# 测试路径
testpaths = tests std_my_dir

# 测试文件模式
python_files = test_*.py *_test.py

# 测试类模式
python_classes = Test*

# 测试函数模式
python_functions = test_*

# 输出选项
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=std_my_dir
    --cov-report=term-missing:skip-covered
    --cov-report=html
    --cov-report=xml
    --cov-branch
    --cov-fail-under=85

# 标记定义
markers =
    slow: 标记为慢速测试
    integration: 集成测试
    unit: 单元测试

# 忽略的警告
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# 覆盖率报告目录
# 由 .coveragerc 控制

# 最小 Python 版本
minversion = 6.0

# 严格模式
strict = true

# 显示本地变量
showlocals = true

# 捕获输出
capture = no

# 日志
log_cli = true
log_cli_level = INFO
