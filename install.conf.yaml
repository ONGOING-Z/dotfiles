- defaults:
    link:
      create: true
      relink: true

- clean: ['~']

- link:
    ~/.tmux.conf: tmux/tmux.conf
    ~/.vimrc: vim/vimrc_whole.backup
    ~/.zshrc: zshrc
    ~/.bash_aliases: bash_aliases
    ~/.gdbinit: .gdbinit
    ~/.gitconfig: git/gitconfig
    ~/.pip/pip.conf: .pip/pip.conf
    ~/.config/nvim/init.vim: nvim/init.vim
    ~/.ripgreprc: .ripgreprc
    # arthas properties (link only when directory exists; see shell task below)
    # /usr/local/arthas-packaging-4.0.5-bin/arthas.properties: arthas/arthas.properties

- create:
    - ~/downloads
    - ~/.vim/undo-history
    - ~/.pip
    - ~/.config/nvim

- shell:
    - [git submodule update --init --recursive, Installing submodules]
    - [
        'test -d /usr/local/arthas-packaging-4.0.5-bin && \
         ln -snf "${PWD}/arthas/arthas.properties" \
         /usr/local/arthas-packaging-4.0.5-bin/arthas.properties || \
         echo "[skip] arthas directory not found"',
        'Link arthas properties if present'
      ]
