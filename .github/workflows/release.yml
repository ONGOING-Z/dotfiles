name: release

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g., v1.1.0)"
        required: true

permissions:
  contents: write

jobs:
  create_release:
    runs-on: ubuntu-latest
    steps:
      - name: Create or update GitHub Release
        uses: actions/github-script@v7
        with:
          script: |
            const inputTag = core.getInput('tag');
            const tag = inputTag || (context.ref.startsWith('refs/tags/') ? context.ref.replace('refs/tags/', '') : '');
            if (!tag) {
              core.setFailed('No tag provided or detected.');
              return;
            }
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = `${tag}: 交互搜索与安装体验优化`;
            const body = [
              '主要更新：',
              '',
              '- 安装器：交互模式可输出复用命令；新增 --profile-save/--profile-load；支持 --gum-install；Bash 3 兼容修复',
              '- Zsh：z/zi 基于 zoxide，缺失时提示自动安装；rgp 提供交互式 ripgrep 弹窗（fzf/fzf-tmux）',
              '- 搜索预览：bat 高对比度（numbers, grid, highlight-line），fd 缺失自动回退，rgp 不依赖 fd',
              '- 文档：README 补充安装参数与使用说明',
              '',
              '提示：',
              '- 推荐安装 fd ripgrep fzf bat 以获得最佳体验',
              '- tmux 建议启用 RGB：default-terminal tmux-256color + terminal-overrides 加 RGB',
            ].join('\n');

            async function getReleaseByTag(tag) {
              try {
                return await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              } catch (e) {
                return null;
              }
            }

            const existing = await getReleaseByTag(tag);
            if (existing && existing.data && existing.data.id) {
              await github.rest.repos.updateRelease({
                owner,
                repo,
                release_id: existing.data.id,
                tag_name: tag,
                name: title,
                body,
                draft: false,
                prerelease: false,
              });
            } else {
              await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                name: title,
                body,
                draft: false,
                prerelease: false,
                generate_release_notes: true,
              });
            }
