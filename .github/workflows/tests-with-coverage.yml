name: Tests with Coverage

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [macos, linux]

jobs:
  test-python:
    name: Python Tests with Coverage
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.PAT_FOR_PRIVATE_SUBMODULES || secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov coverage
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
      
      - name: Run tests with coverage
        run: |
          pytest --cov=std_my_dir --cov-report=xml --cov-report=html --cov-report=term
      
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: python
          name: codecov-python
          fail_ci_if_error: false
      
      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report-python
          path: htmlcov/
      
      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMUM_GREEN: 85
          MINIMUM_ORANGE: 70
          ANNOTATE_MISSING_LINES: true
          ANNOTATION_TYPE: warning

  test-shell:
    name: Shell Scripts Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.PAT_FOR_PRIVATE_SUBMODULES || secrets.GITHUB_TOKEN }}
      
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bats shellcheck
      
      - name: Run shellcheck
        run: |
          find . -type f -name "*.sh" -o -name "install" | xargs shellcheck || true
      
      - name: Run shell tests
        run: |
          if [ -f tests/test_install.sh ]; then
            chmod +x tests/test_install.sh
            ./tests/test_install.sh || true
          fi
      
      - name: Test install script dry-run
        run: |
          ./install --dry-run --only-links
      
      - name: Generate shell coverage (optional)
        run: |
          # 使用 kcov 生成 shell 脚本覆盖率（如果需要）
          if command -v kcov &> /dev/null; then
            kcov coverage/ ./install --help
          fi

  coverage-summary:
    name: Coverage Summary
    runs-on: ubuntu-latest
    needs: [test-python, test-shell]
    if: always()
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Download Python coverage
        uses: actions/download-artifact@v3
        with:
          name: coverage-report-python
          path: coverage-python/
      
      - name: Display coverage summary
        run: |
          echo "## Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -d coverage-python ]; then
            echo "### Python Coverage" >> $GITHUB_STEP_SUMMARY
            if [ -f coverage-python/index.html ]; then
              echo "✅ Python coverage report generated" >> $GITHUB_STEP_SUMMARY
            fi
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "- Review coverage reports in artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- Improve test coverage for uncovered code" >> $GITHUB_STEP_SUMMARY