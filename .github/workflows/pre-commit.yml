---
name: pre-commit

on:
  push:
  pull_request:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Detect changed files
        id: diff
        run: |
          git fetch origin ${GITHUB_BASE_REF:-${{ github.ref_name }}} --depth=1 || true
          base=${GITHUB_BASE_REF}
          if [ -z "$base" ]; then base=$(git rev-parse HEAD~1 || echo HEAD); fi
          echo "base=$base" >> $GITHUB_OUTPUT
      - name: Run pre-commit (changed files)
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: --from-ref ${{ steps.diff.outputs.base }} --to-ref HEAD --show-diff-on-failure
      - name: Auto-commit pre-commit fixes (if any)
        if: ${{ always() }}
        run: |
          if ! git diff --quiet --exit-code; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore(pre-commit): auto-apply formatting and fixes"
            git push
          else
            echo "No changes to commit"
          fi
