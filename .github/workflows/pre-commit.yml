---
name: pre-commit

on:
  push:
  pull_request:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Ensure we are on a branch ref (not detached) when possible
          ref: ${{ github.head_ref || github.ref }}
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Detect changed files
        id: diff
        run: |
          if [ -n "$GITHUB_BASE_REF" ]; then
            git fetch origin "$GITHUB_BASE_REF" --depth=1 || true
            echo "from=origin/$GITHUB_BASE_REF" >> $GITHUB_OUTPUT
          else
            prev=$(git rev-parse HEAD^ || echo HEAD)
            echo "from=$prev" >> $GITHUB_OUTPUT
          fi
          echo "to=HEAD" >> $GITHUB_OUTPUT
      - name: Run pre-commit (changed files)
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: --from-ref ${{ steps.diff.outputs.from }} --to-ref ${{ steps.diff.outputs.to }} --show-diff-on-failure
      - name: Auto-commit pre-commit fixes (if any)
        if: ${{ always() }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if ! git diff --quiet --exit-code; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore(pre-commit): auto-apply formatting and fixes"

            # Determine branch to push to
            BRANCH="$HEAD_REF"
            if [ -z "$BRANCH" ]; then
              BRANCH="$REF_NAME"
            fi

            # Allow push only for push events or same-repo PRs
            CAN_PUSH="false"
            if [ "$EVENT_NAME" = "push" ]; then
              CAN_PUSH="true"
            elif [ -n "$PR_HEAD_REPO" ] && [ "$PR_HEAD_REPO" = "$REPO" ]; then
              CAN_PUSH="true"
            fi

            if [ -n "$BRANCH" ] && [ "$CAN_PUSH" = "true" ]; then
              echo "Pushing auto-fixes to $BRANCH"
              git push origin HEAD:"$BRANCH"
            else
              echo "Skip pushing auto-fixes (detached HEAD or forked PR)."
            fi
          else
            echo "No changes to commit"
          fi
