---
name: Auto PR on Push

on:
  push:
    branches-ignore:
      - macos
      - linux
      - 'auto-pr/**'

jobs:
  open-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Create or Reuse Pull Request and Comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = `${owner}:${context.ref.replace('refs/heads/','')}`;
            const base = context.payload.repository.default_branch;
            const branchName = context.ref.replace('refs/heads/','');

            // Shanghai date (YYYY-MM-DD)
            const shDate = new Intl.DateTimeFormat('en-CA', {
              timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit'
            }).format(new Date());

            // check existing open PRs
            const { data: prs } = await github.rest.pulls.list({
              owner, repo, state: 'open', head, base
            });
            if (prs.length > 0) {
              const pr = prs[0];
              core.info(`PR already exists: ${pr.html_url}`);
              // ensure title includes Shanghai date suffix
              const desiredTitle = `chore: auto PR - ${branchName} - ${shDate}`;
              if (pr.title !== desiredTitle) {
                await github.rest.pulls.update({
                  owner, repo, pull_number: pr.number, title: desiredTitle
                });
              }
              // leave a comment to indicate push happened and checks will rerun
              const comment = [
                'New commits pushed to the source branch. CI will rerun automatically.',
                '',
                `- Branch: \`${branchName}\``,
                `- Commit: \`${context.sha}\``
              ].join('\n');
              await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body: comment });
              return;
            }

            const title = `chore: auto PR - ${branchName} - ${shDate}`;
            const bodyLines = [
              'This pull request was automatically created by GitHub Actions.',
              '',
              `- Source branch: \`${branchName}\``,
              `- Base: \`${base}\``,
              `- Pusher: \`${context.actor}\``
            ];
            const body = bodyLines.join('\n');

            const { data: pr } = await github.rest.pulls.create({ owner, repo, head, base, title, body });
            core.info(`Created PR: ${pr.html_url}`);
