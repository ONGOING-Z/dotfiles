---
name: Auto PR on Push

on:
  push:
    branches-ignore:
      - macos
      - linux
      - 'auto-pr/**'

jobs:
  open-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Create or Reuse Pull Request and Comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = `${owner}:${context.ref.replace('refs/heads/','')}`;
            const base = context.payload.repository.default_branch;
            const branchName = context.ref.replace('refs/heads/','');

            // Shanghai date (YYYY-MM-DD)
            const shDate = new Intl.DateTimeFormat('en-CA', {
              timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit'
            }).format(new Date());

            // check existing open PRs
            const { data: prs } = await github.rest.pulls.list({
              owner, repo, state: 'open', head, base
            });
            if (prs.length > 0) {
              const pr = prs[0];
              core.info(`PR already exists: ${pr.html_url}`);
              // ensure title includes Shanghai date suffix
              const cnMap = [
                { re: /^feat[\/-]/i, cn: '功能' },
                { re: /^fix[\/-]/i, cn: '修复' },
                { re: /^docs[\/-]/i, cn: '文档' },
                { re: /^ci[\/-]/i, cn: 'CI' },
                { re: /^chore[\/-]/i, cn: '杂务' },
              ];
              let kind = '更新';
              let desc = branchName;
              for (const it of cnMap) {
                if (it.re.test(branchName)) {
                  kind = it.cn;
                  desc = branchName.replace(it.re, '');
                  break;
                }
              }
              desc = desc.replace(/(^-|^_|\/-)/, '').replace(/[-_]/g, ' ').replace(/\b\d{4}-\d{2}-\d{2}\b/g, '').trim() || '更新';
              const desiredTitle = `${kind}: ${desc} - ${shDate}`;
              if (pr.title !== desiredTitle) {
                await github.rest.pulls.update({
                  owner, repo, pull_number: pr.number, title: desiredTitle
                });
              }
              // leave a comment to indicate push happened and checks will rerun
              const comment = [
                'New commits pushed to the source branch. CI will rerun automatically.',
                '',
                `- Branch: \`${branchName}\``,
                `- Commit: \`${context.sha}\``
              ].join('\n');
              await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body: comment });
              // Upsert generated section (header + summary) and dedupe any existing ones
              try {
                const { data: commits } = await github.rest.pulls.listCommits({ owner, repo, pull_number: pr.number, per_page: 50 });
                const last = commits.slice(-10);
                const bullets = last.map(c => `- ${c.sha.substring(0,7)} ${c.commit.message.split('\n')[0]}`);
                const header = [
                  'This pull request was automatically created by GitHub Actions.',
                  '',
                  `- Source branch: \`${branchName}\``,
                  `- Base: \`${base}\``,
                  `- Pusher: \`${context.actor}\``
                ].join('\n');
                const section = [
                  '<!-- auto-section:start -->',
                  header,
                  '',
                  '<!-- auto-summary:start -->',
                  '变更要点（自动生成）',
                  '',
                  ...bullets,
                  '<!-- auto-summary:end -->',
                  '<!-- auto-section:end -->',
                ].join('\n');
                let body = pr.body || '';
                const reSection = new RegExp('<!-- auto-section:start -->[\\s\\S]*?<!-- auto-section:end -->', 'g');
                const reSummary = new RegExp('<!-- auto-summary:start -->[\\s\\S]*?<!-- auto-summary:end -->', 'g');
                const reHeader = new RegExp('This pull request was automatically created by GitHub Actions\.[\\s\\S]*?- Pusher: `.*?`', 'g');
                body = body.replace(reSection, '').replace(reSummary, '').replace(reHeader, '').trim();
                const nextBody = (body ? body + '\n\n' : '') + section;
                await github.rest.pulls.update({ owner, repo, pull_number: pr.number, body: nextBody });
              } catch (e) { core.warning(`Update PR body failed: ${e.message}`); }
              return;
            }

            const cnMap = [
              { re: /^feat[\/-]/i, cn: '功能' },
              { re: /^fix[\/-]/i, cn: '修复' },
              { re: /^docs[\/-]/i, cn: '文档' },
              { re: /^ci[\/-]/i, cn: 'CI' },
              { re: /^chore[\/-]/i, cn: '杂务' },
            ];
            let kind = '更新';
            let desc = branchName;
            for (const it of cnMap) {
              if (it.re.test(branchName)) {
                kind = it.cn;
                desc = branchName.replace(it.re, '');
                break;
              }
            }
            desc = desc.replace(/(^-|^_|\/-)/, '').replace(/[-_]/g, ' ').replace(/\b\d{4}-\d{2}-\d{2}\b/g, '').trim() || '更新';
            const title = `${kind}: ${desc} - ${shDate}`;
            const bodyLines = [
              'This pull request was automatically created by GitHub Actions.',
              '',
              `- Source branch: \`${branchName}\``,
              `- Base: \`${base}\``,
              `- Pusher: \`${context.actor}\``
            ];
            const body = bodyLines.join('\n');

            const { data: pr } = await github.rest.pulls.create({ owner, repo, head, base, title, body });
            // Optional: label and assign
            try {
              await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: ['automated','ci'] });
            } catch (e) { core.warning(`Labeling failed: ${e.message}`); }
            try {
              await github.rest.issues.addAssignees({ owner, repo, issue_number: pr.number, assignees: [owner] });
            } catch (e) { core.warning(`Assign failed: ${e.message}`); }
            // Label based on branch prefix
            const lower = branchName.toLowerCase();
            const map = [
              { p: 'fix-', l: 'fix' },
              { p: 'feat-', l: 'feature' },
              { p: 'docs-', l: 'docs' },
              { p: 'ci-', l: 'ci' },
              { p: 'chore-', l: 'chore' },
            ];
            for (const it of map) {
              if (lower.startsWith(it.p)) {
                try { await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: [it.l] }); } catch {}
                break;
              }
            }
            // Add initial generated section (header + summary) and dedupe defensively
            try {
              const { data: commits } = await github.rest.pulls.listCommits({ owner, repo, pull_number: pr.number, per_page: 50 });
              const last = commits.slice(-10);
              const bullets = last.map(c => `- ${c.sha.substring(0,7)} ${c.commit.message.split('\n')[0]}`);
              const header = [
                'This pull request was automatically created by GitHub Actions.',
                '',
                `- Source branch: \`${branchName}\``,
                `- Base: \`${base}\``,
                `- Pusher: \`${context.actor}\``
              ].join('\n');
              const section = [
                '<!-- auto-section:start -->',
                header,
                '',
                '<!-- auto-summary:start -->',
                '变更要点（自动生成）',
                '',
                ...bullets,
                '<!-- auto-summary:end -->',
                '<!-- auto-section:end -->',
              ].join('\n');
              const reSection = new RegExp('<!-- auto-section:start -->[\\s\\S]*?<!-- auto-section:end -->', 'g');
              const reSummary = new RegExp('<!-- auto-summary:start -->[\\s\\S]*?<!-- auto-summary:end -->', 'g');
              const reHeader = new RegExp('This pull request was automatically created by GitHub Actions\.[\\s\\S]*?- Pusher: `.*?`', 'g');
              const baseBody = (body || '').replace(reSection, '').replace(reSummary, '').replace(reHeader, '').trim();
              await github.rest.pulls.update({ owner, repo, pull_number: pr.number, body: (baseBody ? baseBody + '\n\n' : '') + section });
            } catch (e) { core.warning(`Init PR body summary failed: ${e.message}`); }
            core.info(`Created PR: ${pr.html_url}`);
