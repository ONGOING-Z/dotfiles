# git-cliff 配置文件
# https://git-cliff.org/docs/configuration

[changelog]
# 更新日志头部
header = """
# 更新日志

所有重要更改都会记录在此文件中。

格式基于 [Keep a Changelog](https://keepachangelog.com/zh-CN/1.0.0/)，
版本号遵循 [Semantic Versioning](https://semver.org/lang/zh-CN/)。
"""
# 更新日志主体模板
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [未发布]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {% if commit.breaking %}[**BREAKING**] {% endif %}{{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}\n
"""
# 更新日志尾部
footer = """
<!-- 由 git-cliff 自动生成 -->
"""
# 移除前导和尾随空白
trim = true

[git]
# 是否按照常规提交规范解析提交信息
conventional_commits = true
# 提交过滤器
filter_unconventional = true
# 提交分组
commit_groups = [
    { name = "✨ 功能", group = "功能", pattern = "^feat" },
    { name = "🐛 修复", group = "修复", pattern = "^fix" },
    { name = "📚 文档", group = "文档", pattern = "^docs" },
    { name = "🎨 样式", group = "样式", pattern = "^style" },
    { name = "♻️ 重构", group = "重构", pattern = "^refactor" },
    { name = "⚡ 性能", group = "性能", pattern = "^perf" },
    { name = "✅ 测试", group = "测试", pattern = "^test" },
    { name = "🔧 构建", group = "构建", pattern = "^build" },
    { name = "👷 CI", group = "CI", pattern = "^ci" },
    { name = "🔨 杂项", group = "杂项", pattern = "^chore" },
    { name = "⏪ 回滚", group = "回滚", pattern = "^revert" },
]
# 提交预处理器
commit_preprocessors = [
    { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](https://github.com/ONGOING-Z/dotfiles/issues/${2}))" },
]
# 提交解析器
commit_parsers = [
    { message = "^feat", group = "功能" },
    { message = "^fix", group = "修复" },
    { message = "^docs", group = "文档" },
    { message = "^style", group = "样式" },
    { message = "^refactor", group = "重构" },
    { message = "^perf", group = "性能" },
    { message = "^test", group = "测试" },
    { message = "^build", group = "构建" },
    { message = "^ci", group = "CI" },
    { message = "^chore", group = "杂项" },
    { message = "^revert", group = "回滚" },
]
# 保护破坏性更改
protect_breaking_commits = false
# 按作用域过滤
filter_commits = false
# 标签模式
tag_pattern = "v[0-9]*"
# 跳过标签
skip_tags = "v0.1.0-beta.1"
# 忽略标签
ignore_tags = ""
# 排序提交
sort_commits = "oldest"
